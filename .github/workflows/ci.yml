name: CI
# The same checks as .githooks/pre-commit, on every push to main and every PR
# that touches more than documentation.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - "**.md"
      - "docs/**"
      - "previous-iterations/**"
  pull_request:
    paths-ignore: *docs

jobs:
  check:
    # The e2e tests open real browser windows; GitHub's macOS runners have a
    # logged-in GUI session. xcode-27 is the macOS 27 image: on macos-26 the
    # older WebKit lacks private settings the tests require (Global Privacy
    # Control, among others).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
