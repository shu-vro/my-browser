name: Release
# A push to the `release` branch publishes Cargo.toml's package.version as
# v<version>. If that tag already exists (the version wasn't bumped), the
# workflow stops before building anything. Assets: a universal (Apple
# Silicon + Intel) DMG, its SHA-256, and the debug symbols for symbolicating
# crash reports. The browser's "Check for
# Updates…" opens the latest of these releases.
on:
  push:
    branches: [release]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # Only the owner can push to `release` (repository ruleset "release: owner
    # only"); this check is the second lock.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, to see if this version is out already
      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released; bump package.version in Cargo.toml to release."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # history and tags, for the release notes
      - name: Rust
        run: rustup update stable && rustup default stable && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Sound device
        # GitHub's Mac runners have no audio device, so WebKit never reports
        # sound playing and the picture-in-picture test (it only follows
        # videos with sound) can't pass. BlackHole is a virtual one.
        run: |
          system_profiler SPAudioDataType
          brew install --cask blackhole-2ch
          sudo killall coreaudiod || true
          sleep 3
          system_profiler SPAudioDataType
      - name: Test
        run: cargo test --release
      - name: Signing certificate
        # The owner's Apple Development certificate (secrets SIGNING_P12, a
        # base64 .p12 export, and SIGNING_P12_PASSWORD) gives every release the
        # same code identity, so saved passwords in the Keychain and privacy
        # permissions keep trusting the browser after an update. Without the
        # secrets the build is signed ad hoc, as before.
        env:
          P12: ${{ secrets.SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::notice::No signing secrets: the release is signed ad hoc."
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw=$(openssl rand -hex 16)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/id.p12"
          # The intermediate that issues Apple Development certificates; without
          # it codesign can't build the chain (errSecInternalComponent).
          curl -sSfL --max-time 60 -o "$RUNNER_TEMP/wwdr-g3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/wwdr-g3.cer" -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id=$(security find-identity -v -p codesigning "$kc" | grep -oE '[0-9A-F]{40}' | head -1)
          if [ -z "$id" ]; then
            echo "::error::SIGNING_P12 holds no valid code-signing identity."
            exit 1
          fi
          echo "SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
          UNIVERSAL: "1"
          # Symbols go to a separate .dSYM (published, not shipped in the app):
          # the binary stays the same size and crash reports can be symbolicated.
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: packed
        run: |
          ./scripts/bundle.sh
          ./scripts/dmg.sh
          mkdir -p dist
          cp "target/release/my-browser-$VERSION.dmg" dist/
          (cd dist && shasum -a 256 "my-browser-$VERSION.dmg" > SHA256SUMS)
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cp -RL "target/$t/release/my-browser.dSYM" "dist/my-browser-$VERSION-$t.dSYM"
            ditto -c -k --keepParent "dist/my-browser-$VERSION-$t.dSYM" "dist/my-browser-$VERSION-$t.dSYM.zip"
          done
          # Fail rather than publish an ad hoc build when signing was set up.
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            codesign -dv target/release/my-browser.app 2>&1 | grep -q '^TeamIdentifier=[A-Z0-9]\{10\}$'
          fi
      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Notes: how to install, then every commit since the last release
          # with its description and author. The author is their GitHub
          # @login (a link to the profile) when the commit email belongs to an
          # account, else the plain git name.
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          {
            echo "Open the DMG and drag my-browser to Applications."
            echo
            echo "This build isn't notarized by Apple, so macOS blocks its first launch: open it once, then choose **Open Anyway** in System Settings → Privacy & Security. (Or run \`xattr -dr com.apple.quarantine /Applications/my-browser.app\`.)"
            echo
            echo "## Changes${prev:+ since $prev}"
            echo
            for sha in $(git log --no-merges --format=%H "${prev:+$prev..}HEAD"); do
              login=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.author.login // empty' 2>/dev/null || true)
              by=${login:+@$login}
              git log -1 --format="- **%s** ([%h]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/%H)) by ${by:-%an}%n%n%w(0,2,2)%b" "$sha"
            done
          } > notes.md
          gh release create "v$VERSION" dist/*.dmg dist/*.dSYM.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "my-browser $VERSION" --notes-file notes.md
