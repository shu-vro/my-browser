# Weekly pull requests for crate and GitHub Actions updates. Security alerts
# (RustSec advisories for Cargo.lock) are on in the repository settings.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
