[package]
name = "my-browser"
version = "0.1.0"
edition = "2024"
default-run = "my-browser"

[dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-web-kit = "0.3.2"
rusqlite = "0.40.2"

[[bin]]
name = "my-browser"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "benchmark/bench.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
